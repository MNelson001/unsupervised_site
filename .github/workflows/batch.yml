# Every 3 hours: claim the queued changes, let Claude build them, guard, deploy, report.
#
# Secrets:   ANTHROPIC_API_KEY, RUNNER_SECRET, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Variables: CONTROL_URL (e.g. https://queue.unsupervised.website),
#            SITE_URL (e.g. https://unsupervised.website),
#            PAGES_PROJECT (Cloudflare Pages project name)
name: Build the queue

on:
  schedule:
    - cron: "5 */3 * * *" # 5 minutes after each window closes (UTC)
  workflow_dispatch:

concurrency:
  group: batch
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CONTROL_URL: ${{ vars.CONTROL_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the push token off disk while the agent runs.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Claim batch
        id: claim
        run: node scripts/claim.mjs
        env:
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}

      - name: Build the changes
        if: steps.claim.outputs.has_changes == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # No shell and no web access: the agent can only read and edit files.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 300
            --allowedTools Read,Glob,Grep,Edit,Write
            --disallowedTools Bash,WebFetch,WebSearch,NotebookEdit
          prompt: |
            Read CLAUDE.md and follow it exactly. Then read batch.json and the site in src/.
            Plan how to build every change in the batch together, implement all of them in src/,
            and finish by writing batch-result.json with one entry per change.

      - name: Guard
        if: steps.claim.outputs.has_changes == 'true'
        run: node scripts/guard.mjs
        env:
          GUARD_SECRETS: ${{ secrets.ANTHROPIC_API_KEY }},${{ secrets.RUNNER_SECRET }},${{ secrets.CLOUDFLARE_API_TOKEN }},${{ github.token }}

      - name: Build site
        if: steps.claim.outputs.has_changes == 'true'
        run: npm run build

      - name: Commit and push
        id: push
        if: steps.claim.outputs.has_changes == 'true'
        run: |
          git config user.name "unsupervised-bot"
          git config user.email "bot@unsupervised.website"
          git add src
          if git commit -m "Batch ${{ steps.claim.outputs.batch_id }}"; then
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:${{ github.ref_name }}
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.claim.outputs.has_changes == 'true'
        run: npx --yes wrangler@3.114.0 pages deploy dist --project-name "${{ vars.PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check
        if: steps.claim.outputs.has_changes == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$SITE_URL/" | grep -q "_unsupervised/footer.js"; then exit 0; fi
            sleep 10
          done
          echo "Site is down or the footer is missing" && exit 1

      - name: Report
        if: steps.claim.outputs.has_changes == 'true'
        run: node scripts/report.mjs
        env:
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          COMMIT_SHA: ${{ steps.push.outputs.sha }}

      # Anything above failed: roll the site back and return every token in the batch.
      - name: Roll back
        if: failure() && steps.push.outputs.pushed == 'true'
        run: |
          git revert --no-edit HEAD
          npm run build
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:${{ github.ref_name }}
          npx --yes wrangler@3.114.0 pages deploy dist --project-name "${{ vars.PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Return tokens
        if: failure() && steps.claim.outputs.has_changes == 'true'
        run: node scripts/report.mjs
        env:
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          FAIL_ALL: "1"
